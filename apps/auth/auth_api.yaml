openapi: 3.0.3
info:
  title: EcoHome Auth Service API
  version: 1.1.0
  description: |
    Authentication and user management microservice for EcoHome.
    Updated with account deletion and profile management.

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'OK'

  /auths/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auths/login:
    post:
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auths/logout:
    post:
      summary: Log out user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auths/:
    delete:
      summary: Delete/Anonymize User Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account anonymised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auths/password:
    put:
      summary: Change User Password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auths/username:
    put:
      summary: Change Username
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
      responses:
        '200':
          description: Username updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '409':
          $ref: '#/components/responses/Conflict'

  /auths/token:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'

  /auths/jwt:
    post:
      summary: Get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTToken'

  /auths/verify:
    get:
      summary: Verify Token Validity
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Valid
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jwt/secretKeys:
    get:
      summary: Get all keys
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Keys retrieved

  /jwt/secretKey:
    get:
      summary: Get current key
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Key retrieved

components:
  schemas:
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }

    LoginRequest:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        password: { type: string }

    TokenRequest:
      type: object
      required: [user_id, refresh_token]
      properties:
        user_id: { type: integer }
        refresh_token: { type: string }

    DeleteAccountRequest:
      type: object
      required: [refresh_token, password]
      properties:
        refresh_token: { type: string }
        password: { type: string }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string }

    ChangeUsernameRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }

    SuccessMessage:
      type: object
      properties:
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        is_active: { type: boolean }

    RefreshToken:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    JWTToken:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: AUTH-API-KEY
    BearerAuth:
      type: http
      scheme: bearer
