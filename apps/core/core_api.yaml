openapi: 3.0.3
info:
  title: EcoHome Core Service API
  version: 1.0.0
  description: >
    Backend service for the EcoHome application. Handles user profiles, 
    friendships, eco-quizzes, and daily challenges.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PublicProfile:
      type: object
      properties:
        user_id:
          type: integer
          format: uint
        username:
          type: string
        bio:
          type: string
        avatar_url:
          type: string
          description: URL to fetch the avatar image
        is_graph_public:
          type: boolean

    UpdateProfileRequest:
      type: object
      required:
        - bio
        - is_graph_public
      properties:
        bio:
          type: string
        is_graph_public:
          type: boolean

    FriendRequestInput:
      type: object
      required:
        - target_id
      properties:
        target_id:
          type: integer
          format: uint

    FriendRespondInput:
      type: object
      required:
        - target_id
        - action
      properties:
        target_id:
          type: integer
          format: uint
        action:
          type: string
          enum: [accept, reject]

    QuizzDataResponse:
      type: object
      properties:
        id:
          type: string
          example: 'transport'
        rootId:
          type: string
          example: 'Q1'
        questions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Question'

    Question:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        evolution:
          type: string
        responses:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        carbonImpact:
          type: array
          items:
            type: number
            format: float

    Answer:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        children:
          type: array
          items:
            type: string
        carbonImpact:
          type: array
          items:
            type: number
            format: float

    SubmitQuizzResultRequest:
      type: object
      required:
        - category
        - emission
      properties:
        category:
          type: string
        emission:
          type: number
          format: float

    QuizzHistoryItem:
      type: object
      properties:
        date:
          type: string
          format: date-time
        emission:
          type: number
          format: float
        category:
          type: string

    DailyDefiResponse:
      type: object
      properties:
        id:
          type: string
        defi:
          type: string
        category:
          type: string
        leafReward:
          type: integer
        status:
          type: string
          enum: [PENDING, COMPLETED]
        earned:
          type: integer
        overQuestions:
          $ref: '#/components/schemas/DefiQuestion'

    DefiQuestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        responses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              leafReward:
                type: integer
              percentReward:
                type: integer

    CompleteDefiRequest:
      type: object
      required:
        - defiId
        - answerId
      properties:
        defiId:
          type: string
        answerId:
          type: string

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health Check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'OK'

  /users/avatar/{id}:
    get:
      summary: Get User Avatar
      description: Returns the raw image data (PNG or JPEG) for a user's avatar.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Avatar image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar not found
  /users/profile:
    get:
      summary: Get Profile
      description: Get profile of the current user or a specific user by ID.
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: The ID of the user to fetch. If omitted, returns current user's profile.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          description: User not found

    put:
      summary: Update Profile
      description: Update the current user's bio and privacy settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully

  /users/avatar:
    post:
      summary: Upload Avatar
      description: Upload a new avatar image (PNG or JPEG, max 2MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  url:
                    type: string
        '400':
          description: Invalid file or format
  /users/friends:
    get:
      summary: List Friends
      description: Get a list of users with whom the current user has an ACCEPTED friendship.
      responses:
        '200':
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicProfile'

  /users/friends/search:
    get:
      summary: Search Users
      description: Search for users by username (requires at least 1 character).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results with status
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/PublicProfile'
                    - type: object
                      properties:
                        status:
                          type: string
                          enum: [NONE, FRIEND, PENDING_SENT, PENDING_RECEIVED]

  /users/friends/sent:
    get:
      summary: List Sent Requests
      description: Get a list of pending friend requests sent BY the user.
      responses:
        '200':
          description: List of sent requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicProfile'

  /users/friends/cancel:
    post:
      summary: Cancel Friend Request
      description: Cancel a pending request sent by the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id:
                  type: integer
                  format: uint
      responses:
        '200':
          description: Request cancelled
        '404':
          description: Request not found

  /users/friends/requests:
    get:
      summary: List Friend Requests
      description: Get a list of pending friend requests received by the user.
      responses:
        '200':
          description: List of pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicProfile'

  /users/friends/search:
    get:
      summary: Search Users
      description: Search for users by username (requires at least 3 characters).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicProfile'

  /users/friends/request:
    post:
      summary: Send Friend Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestInput'
      responses:
        '201':
          description: Request sent
        '400':
          description: Cannot add self
        '404':
          description: Target user not found
        '409':
          description: Friendship or request already exists

  /users/friends/respond:
    post:
      summary: Respond to Friend Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRespondInput'
      responses:
        '200':
          description: Request accepted or rejected
  /users/quizz/data:
    get:
      summary: Get Quizz Data
      description: Retrieve the tree of questions for a specific category.
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quizz data loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizzDataResponse'
        '404':
          description: Category not found

  /users/quizz/result:
    post:
      summary: Submit Quizz Result
      description: Save the calculated carbon emission for a specific category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizzResultRequest'
      responses:
        '200':
          description: Result saved

  /users/quizz/history:
    get:
      summary: Get Quizz History
      description: Retrieve past quizz results.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
      responses:
        '200':
          description: History retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizzHistoryItem'
  /users/defi/daily:
    get:
      summary: Get Daily Defis
      description: Retrieves 3 daily challenges for the user. Generates them if they don't exist for today.
      responses:
        '200':
          description: List of daily challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyDefiResponse'

  /users/defi/complete:
    post:
      summary: Complete a Defi
      description: Marks a daily challenge as completed and calculates rewards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDefiRequest'
      responses:
        '200':
          description: Challenge completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'COMPLETED'
                  reward:
                    type: integer
        '404':
          description: Challenge not found or not assigned for today
        '409':
          description: Challenge already completed
